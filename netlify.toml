# Netlify config for git-groceries.
# The site is plain static files (no build step); the one dynamic piece is a
# serverless function that appends phone-added items to list.md via the GitHub API.

[build]
  publish = "."
  functions = "netlify/functions"
  # Skip the deploy unless site code actually changed. The live page reads
  # list.md/recipes.md straight from GitHub Pages, so grocery-data commits
  # (phone adds, Claude pushes, rotation, meal plans) never need a Netlify
  # rebuild — this cancels those builds so they don't burn deploy credits.
  # Only index.html / the function / this config trigger a real deploy.
  # `git diff --quiet` exits 0 (cancel) when those paths are unchanged.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- index.html netlify.toml netlify/functions"

# Nice short path: POST /api/add-item -> the function.
[[redirects]]
  from = "/api/add-item"
  to = "/.netlify/functions/add-item"
  status = 200
