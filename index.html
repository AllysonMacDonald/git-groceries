<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Groceries</title>
<style>
  :root {
    --bg: #f6f6f4;
    --card: #ffffff;
    --text: #1c1c1a;
    --muted: #7a7a72;
    --line: #e6e6e0;
    --accent: #3a7d44;
    --accent-soft: #eaf3ec;
    --done: #b7b7ae;
    --shadow: 0 1px 2px rgba(0,0,0,.05), 0 4px 16px rgba(0,0,0,.04);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16171a;
      --card: #1e2024;
      --text: #ecece8;
      --muted: #9a9a92;
      --line: #2c2e33;
      --accent: #6dbf78;
      --accent-soft: #21302400;
      --done: #5a5c55;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: max(16px, env(safe-area-inset-top)) 16px calc(48px + env(safe-area-inset-bottom));
    max-width: 640px;
    margin: 0 auto;
  }
  header {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 12px; margin: 8px 2px 20px;
  }
  h1 { font-size: 26px; font-weight: 700; letter-spacing: -.02em; margin: 0; }
  .status {
    font-size: 13px; color: var(--muted); display: flex; align-items: center;
    gap: 6px; white-space: nowrap;
  }
  .dot {
    width: 8px; height: 8px; border-radius: 50%; background: var(--accent);
    box-shadow: 0 0 0 0 var(--accent); animation: pulse 2.4s infinite;
  }
  .dot.stale { background: #c9a227; animation: none; }
  .dot.err { background: #c0392b; animation: none; }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(109,191,120,.5); }
    70% { box-shadow: 0 0 0 7px rgba(109,191,120,0); }
    100% { box-shadow: 0 0 0 0 rgba(109,191,120,0); }
  }
  .summary {
    margin: 0 2px 18px; font-size: 14px; color: var(--muted);
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  .clear {
    font: inherit; font-size: 13px; color: var(--accent); background: none;
    border: none; padding: 4px 2px; cursor: pointer; white-space: nowrap;
  }
  .clear[hidden] { display: none; }
  .add {
    display: flex; gap: 8px; margin: 0 2px 14px;
  }
  .add input {
    flex: 1; font: inherit; font-size: 17px; color: var(--text);
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 12px 14px; box-shadow: var(--shadow); min-width: 0;
  }
  .add input:focus { outline: none; border-color: var(--accent); }
  .add button {
    font: inherit; font-weight: 600; color: #fff; background: var(--accent);
    border: none; border-radius: 12px; padding: 0 18px; cursor: pointer;
    box-shadow: var(--shadow); white-space: nowrap;
  }
  .add button:disabled { opacity: .5; cursor: default; }
  .add-msg {
    margin: -6px 4px 14px; font-size: 13px; color: var(--muted); min-height: 1em;
  }
  .add-msg.ok { color: var(--accent); }
  .add-msg.err { color: #c0392b; }
  .add-msg[hidden] { display: none; }
  .cat {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    box-shadow: var(--shadow); padding: 6px 16px 10px; margin-bottom: 14px;
  }
  .cat h2 {
    font-size: 12px; font-weight: 700; text-transform: uppercase;
    letter-spacing: .07em; color: var(--muted); margin: 12px 0 6px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .cat h2 .n { font-weight: 600; opacity: .7; }
  ul { list-style: none; margin: 0; padding: 0; }
  li {
    display: flex; align-items: flex-start; gap: 11px; padding: 9px 2px;
    border-top: 1px solid var(--line); font-size: 17px;
    cursor: pointer; user-select: none; -webkit-user-select: none;
    transition: opacity .15s;
  }
  li:first-child { border-top: none; }
  li:active { opacity: .55; }
  .box {
    flex: 0 0 auto; width: 20px; height: 20px; border-radius: 6px;
    border: 2px solid var(--line); margin-top: 1px;
  }
  li.done .box {
    background: var(--accent); border-color: var(--accent);
    position: relative;
  }
  li.done .box::after {
    content: ""; position: absolute; left: 6px; top: 2px; width: 5px; height: 10px;
    border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(45deg);
  }
  .item { flex: 1; }
  li.done .name { color: var(--done); text-decoration: line-through; }
  .note { color: var(--muted); font-size: 14px; }
  .empty {
    text-align: center; color: var(--muted); padding: 60px 20px;
    background: var(--card); border: 1px dashed var(--line); border-radius: 14px;
  }
  .empty .big { font-size: 40px; margin-bottom: 10px; }
  footer { text-align: center; color: var(--muted); font-size: 12px; margin-top: 22px; }
  a { color: var(--accent); }

  /* Recipes below the list */
  #recipes[hidden] { display: none; }
  .recipes-head { margin: 30px 2px 12px; }
  .recipes-title { font-size: 20px; font-weight: 700; letter-spacing: -.01em; margin: 0; }
  .recipes-sub { font-size: 13px; color: var(--muted); margin: 5px 0 0; line-height: 1.45; }
  .recipe {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    box-shadow: var(--shadow); margin-bottom: 12px; overflow: hidden;
  }
  .recipe-head {
    width: 100%; display: flex; align-items: center; gap: 12px; font: inherit;
    background: none; border: none; padding: 14px 16px; cursor: pointer;
    color: var(--text); text-align: left;
  }
  .recipe-head:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .recipe-titles { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .recipe-name { font-size: 17px; font-weight: 650; letter-spacing: -.01em; }
  .recipe-sum { font-size: 13px; color: var(--muted); }
  .chev {
    flex: 0 0 auto; width: 9px; height: 9px; margin-right: 3px;
    border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted);
    transform: rotate(45deg); transition: transform .18s ease;
  }
  .recipe.open .chev { transform: rotate(-135deg); }
  .recipe-body { padding: 0 16px 14px; border-top: 1px solid var(--line); }
  .recipe-body[hidden] { display: none; }
  .ing-label, .method-label {
    font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em;
    color: var(--muted); margin: 15px 0 4px;
  }
  ul.ings { list-style: none; margin: 0; padding: 0; }
  li.ring {
    display: flex; align-items: flex-start; gap: 11px; padding: 8px 2px;
    border-top: 1px solid var(--line); font-size: 16px; cursor: pointer;
    user-select: none; -webkit-user-select: none; transition: opacity .15s;
  }
  li.ring:first-child { border-top: none; }
  li.ring:active { opacity: .55; }
  li.ring.done .box { background: var(--accent); border-color: var(--accent); position: relative; }
  li.ring.done .box::after {
    content: ""; position: absolute; left: 6px; top: 2px; width: 5px; height: 10px;
    border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(45deg);
  }
  li.ring.done .rname { color: var(--done); text-decoration: line-through; }
  .rname { flex: 1; }
  ol.steps { margin: 4px 0 0; padding-left: 22px; }
  ol.steps li { padding: 4px 0 4px 3px; font-size: 15px; line-height: 1.5; }
  .rnote { font-size: 14px; color: var(--muted); margin: 15px 0 2px; line-height: 1.5; }
</style>
</head>
<body>
  <header>
    <h1>Groceries</h1>
    <div class="status"><span class="dot" id="dot"></span><span id="status">Loading…</span></div>
  </header>
  <p class="summary"><span id="summary"></span><button class="clear" id="clear" hidden>Uncheck all</button></p>
  <form class="add" id="add" autocomplete="off">
    <input id="addInput" name="item" type="text" inputmode="text"
      placeholder="Add an item…" maxlength="200" enterkeyhint="done" aria-label="Add an item">
    <button type="submit" id="addBtn">Add</button>
  </form>
  <p class="add-msg" id="addMsg" role="status" aria-live="polite" hidden></p>
  <main id="list"></main>
  <section id="recipes" hidden></section>
  <footer>Live view of <code>list.md</code> · updates automatically</footer>

<script>
(function () {
  // Read list.md/recipes.md straight from GitHub Pages (always current) instead
  // of this site's own deployed copy. That way the page never freezes if Netlify
  // stops auto-redeploying — a phone add (which commits to GitHub) shows up within
  // a minute regardless of Netlify's deploy state. The "Add item" box still POSTs
  // to the Netlify function below, so this page must stay hosted on Netlify.
  var GH_BASE = "https://allysonmacdonald.github.io/git-groceries/";
  var SOURCE = GH_BASE + "list.md";
  var RECIPE_SOURCE = GH_BASE + "recipes.md";
  var POLL_MS = 20000;
  var STORE = "gg.checked.v1";
  var RSTORE = "gg.recipeChecked.v1";
  var ROPEN = "gg.recipeOpen.v1";
  var listEl = document.getElementById("list");
  var recipesEl = document.getElementById("recipes");
  var statusEl = document.getElementById("status");
  var summaryEl = document.getElementById("summary");
  var clearEl = document.getElementById("clear");
  var dotEl = document.getElementById("dot");
  var lastText = null;
  var lastOk = 0;
  var lastCats = [];
  var lastRecipesText = null;
  var lastRecipes = [];
  var lastListTags = [];

  // Locally checked-off items (this device only). Keyed by category+name+note.
  var checked = loadChecked();
  // Recipe ingredient ticks and open/closed recipes — also this device only,
  // and completely separate from the grocery ticks above.
  var recipeChecked = loadSet(RSTORE);
  var recipeOpen = loadSet(ROPEN);

  function loadChecked() {
    try {
      var raw = localStorage.getItem(STORE);
      return raw ? new Set(JSON.parse(raw)) : new Set();
    } catch (e) { return new Set(); }
  }
  function saveChecked() {
    var arr = [];
    checked.forEach(function (k) { arr.push(k); });
    try { localStorage.setItem(STORE, JSON.stringify(arr)); } catch (e) {}
  }
  function loadSet(store) {
    try {
      var raw = localStorage.getItem(store);
      return raw ? new Set(JSON.parse(raw)) : new Set();
    } catch (e) { return new Set(); }
  }
  function saveSet(store, set) {
    var arr = [];
    set.forEach(function (k) { arr.push(k); });
    try { localStorage.setItem(store, JSON.stringify(arr)); } catch (e) {}
  }
  function recipeKey(title, text) { return title + "" + text; }
  function keyFor(cat, name, note) { return cat + "" + name + "" + note; }

  function esc(s) {
    return s.replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  // Escape HTML, then render a tiny markdown subset (**bold**) for recipe text.
  function inline(s) {
    return esc(s).replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  }

  // Normalize a tag/nickname/title for matching: drop parentheticals, keep
  // letters/digits/hyphen/space, lowercase, collapse whitespace.
  function normTag(s) {
    return String(s)
      .toLowerCase()
      .replace(/\([^)]*\)/g, " ")
      .replace(/[^a-z0-9\- ]+/g, " ")
      .replace(/\s+/g, " ")
      .trim();
  }

  // Collect the recipe nicknames referenced by the list's " — note" tags.
  // "Greek pasta salad, chowder" -> ["greek pasta salad","chowder"].
  function listTagsFromCats(cats) {
    var seen = {}, out = [];
    cats.forEach(function (c) {
      c.items.forEach(function (it) {
        if (!it.note) return;
        it.note.split(",").forEach(function (part) {
          var t = normTag(part);
          if (t && !seen[t]) { seen[t] = 1; out.push(t); }
        });
      });
    });
    return out;
  }

  // Does note token `needle` appear as a whole word inside `hay`?
  function wordContains(hay, needle) {
    if (!needle || needle.length < 3) return false;
    var esc = needle.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    try { return new RegExp("\\b" + esc + "\\b").test(hay); } catch (e) { return false; }
  }

  // A recipe is "this week's" if any list note matches its tags or its title.
  function recipeActive(r, listTags) {
    for (var i = 0; i < listTags.length; i++) {
      var t = listTags[i];
      if (!t) continue;
      for (var j = 0; j < r.matchStrings.length; j++) {
        var s = r.matchStrings[j];
        if (s && (s === t || wordContains(s, t))) return true;
      }
    }
    return false;
  }

  // Parse recipes.md into
  // [{title, summary, matchStrings:[...], blocks:[...]}] where a block is one of:
  //   {type:"ingredients", label, items:[text]}  (checkable)
  //   {type:"method", steps:[html]}
  //   {type:"notes", parts:[text]}
  function parseRecipes(md) {
    var lines = md.split(/\r?\n/);
    var recipes = [], cur = null, mode = null, ingBlock = null, method = null, notes = null;

    function finalize(r) {
      var strs = [normTag(r.title)];
      r.tags.forEach(function (t) { if (strs.indexOf(t) === -1) strs.push(t); });
      r.matchStrings = strs;
      delete r.tags;
    }

    for (var i = 0; i < lines.length; i++) {
      var line = lines[i];
      var h2 = line.match(/^##\s+(.*\S)\s*$/);
      if (h2) {
        if (cur) { finalize(cur); recipes.push(cur); }
        cur = { title: h2[1].trim(), summary: "", tags: [], blocks: [] };
        mode = null; ingBlock = null; method = null; notes = null;
        continue;
      }
      if (!cur) continue; // skip the "# Recipes" preamble before the first recipe

      var tagLine = line.match(/^<!--\s*tags?:\s*([\s\S]*?)\s*-->\s*$/i);
      if (tagLine) {
        tagLine[1].split(",").forEach(function (s) {
          var t = normTag(s);
          if (t) cur.tags.push(t);
        });
        continue;
      }

      if (/^---\s*$/.test(line)) { mode = null; continue; }

      // Notes lead-in (may appear after Method, outside any "###").
      var noteLead = line.match(/^\*\*Notes?:?\*\*:?\s*(.*)$/i);
      if (noteLead) {
        notes = { type: "notes", parts: [] };
        if (noteLead[1].trim()) notes.parts.push(noteLead[1].trim());
        cur.blocks.push(notes);
        mode = "notes";
        continue;
      }

      var h3 = line.match(/^###\s+(.*\S)\s*$/);
      if (h3) {
        var name = h3[1].trim().toLowerCase();
        if (name.indexOf("ingredient") !== -1) { mode = "ing"; ingBlock = null; }
        else if (name.indexOf("method") !== -1 || name.indexOf("direction") !== -1 || name.indexOf("step") !== -1) {
          mode = "method"; method = { type: "method", steps: [] }; cur.blocks.push(method);
        } else { mode = "other"; }
        continue;
      }

      // Summary: the italic line right under the title, before any "###".
      if (mode === null && !cur.summary) {
        var em = line.match(/^\*(?!\*)(.+?)\*\s*$/);
        if (em) { cur.summary = em[1].trim(); continue; }
      }

      if (mode === "ing") {
        // A fully-bold label starts an ingredient sub-group (e.g. "**Dressing:**").
        var label = line.match(/^\*\*(.+?)\*\*\s*$/);
        if (label) {
          var lab = label[1].replace(/:\s*$/, "").trim();
          ingBlock = { type: "ingredients", label: lab, items: [] };
          cur.blocks.push(ingBlock);
          continue;
        }
        var item = line.match(/^\s*[-*]\s+\[[ xX]\]\s+(.*\S)\s*$/);
        if (item) {
          if (!ingBlock) { ingBlock = { type: "ingredients", label: "", items: [] }; cur.blocks.push(ingBlock); }
          ingBlock.items.push(item[1].trim());
        }
        continue;
      }

      if (mode === "method") {
        var step = line.match(/^\s*\d+\.\s+(.*\S)\s*$/);
        if (step) { method.steps.push(step[1].trim()); continue; }
        var t = line.trim();
        if (t && method.steps.length) { method.steps[method.steps.length - 1] += " " + t; }
        continue;
      }

      if (mode === "notes") {
        var nt = line.trim();
        if (nt) notes.parts.push(nt);
        continue;
      }
    }
    if (cur) { finalize(cur); recipes.push(cur); }
    return recipes;
  }

  function recipeBodyHtml(r) {
    var out = "";
    r.blocks.forEach(function (b) {
      if (b.type === "ingredients") {
        if (!b.items.length) return;
        if (b.label) out += '<div class="ing-label">' + inline(b.label) + "</div>";
        out += '<ul class="ings">';
        b.items.forEach(function (text) {
          var key = recipeKey(r.title, text);
          var done = recipeChecked.has(key);
          out += '<li class="ring ' + (done ? "done" : "") + '" data-rkey="' + esc(key) +
            '" role="button" aria-pressed="' + (done ? "true" : "false") +
            '"><span class="box"></span><span class="rname">' + inline(text) + "</span></li>";
        });
        out += "</ul>";
      } else if (b.type === "method") {
        if (!b.steps.length) return;
        out += '<div class="method-label">Method</div><ol class="steps">';
        b.steps.forEach(function (st) { out += "<li>" + inline(st) + "</li>"; });
        out += "</ol>";
      } else if (b.type === "notes") {
        if (!b.parts.length) return;
        out += '<p class="rnote"><strong>Notes:</strong> ' + inline(b.parts.join(" ")) + "</p>";
      }
    });
    return out;
  }

  function renderRecipes(recipes, listTags) {
    if (!recipesEl) return;
    recipes = recipes || [];
    listTags = listTags || [];

    // Prune ticks for ingredients no longer in any recipe (keep across active/
    // inactive so a recipe leaving/returning doesn't lose your checklist).
    if (recipes.length) {
      var liveKeys = {};
      recipes.forEach(function (r) {
        r.blocks.forEach(function (b) {
          if (b.type === "ingredients") b.items.forEach(function (t) { liveKeys[recipeKey(r.title, t)] = 1; });
        });
      });
      var pruned = false;
      recipeChecked.forEach(function (k) { if (!liveKeys[k]) { recipeChecked.delete(k); pruned = true; } });
      if (pruned) saveSet(RSTORE, recipeChecked);
    }

    var active = recipes.filter(function (r) { return recipeActive(r, listTags); });
    if (!active.length) { recipesEl.innerHTML = ""; recipesEl.hidden = true; return; }
    recipesEl.hidden = false;

    var html = '<div class="recipes-head"><h2 class="recipes-title">This week’s recipes</h2>' +
      '<p class="recipes-sub">Tap a recipe to open it. Ticking an ingredient here is just your ' +
      'cooking checklist — it doesn’t change the grocery list.</p></div>';
    active.forEach(function (r) {
      var open = recipeOpen.has(r.title);
      html += '<section class="recipe' + (open ? " open" : "") + '">' +
        '<button class="recipe-head" type="button" aria-expanded="' + (open ? "true" : "false") +
        '" data-recipe="' + esc(r.title) + '"><span class="recipe-titles">' +
        '<span class="recipe-name">' + esc(r.title) + "</span>" +
        (r.summary ? '<span class="recipe-sum">' + esc(r.summary) + "</span>" : "") +
        '</span><span class="chev" aria-hidden="true"></span></button>' +
        '<div class="recipe-body"' + (open ? "" : " hidden") + ">" + recipeBodyHtml(r) + "</div>" +
        "</section>";
    });
    recipesEl.innerHTML = html;
  }

  // Parse the "## To buy" section into
  // [{cat, items:[{name, note, done}]}], one entry per "### category".
  function parse(md) {
    var lines = md.split(/\r?\n/);
    var section = null, cats = [], cur = null;
    for (var i = 0; i < lines.length; i++) {
      var line = lines[i];
      var h2 = line.match(/^##\s+(.*\S)\s*$/);
      if (h2) {
        var t = h2[1].trim().toLowerCase();
        if (t === "to buy") { section = "buy"; cur = null; }
        else { section = null; cur = null; }
        continue;
      }
      if (!section) continue;
      var h3 = line.match(/^###\s+(.*\S)\s*$/);
      if (h3 && section === "buy") { cur = { cat: h3[1].trim(), items: [] }; cats.push(cur); continue; }
      var item = line.match(/^\s*[-*]\s+\[( |x|X)\]\s+(.*\S)\s*$/);
      if (item) {
        if (!cur) { cur = { cat: "Items", items: [] }; cats.push(cur); }
        var done = item[1].toLowerCase() === "x";
        var text = item[2].trim();
        var note = "", split = text.split(/\s+[—–-]\s+/);
        if (split.length > 1) { note = split.slice(1).join(" — "); text = split[0]; }
        cur.items.push({ name: text, note: note, done: done });
      }
    }
    return cats.filter(function (c) { return c.items.length > 0; });
  }

  function render(cats) {
    lastCats = cats;
    // Recompute which recipes are "this week's" from the list's note tags,
    // and refresh the recipes panel (uses whatever recipes.md we last fetched).
    lastListTags = listTagsFromCats(cats);
    renderRecipes(lastRecipes, lastListTags);
    // Drop saved checks for items no longer on the list, so storage can't grow
    // unbounded and a re-added item comes back unchecked.
    var live = {};
    cats.forEach(function (c) {
      c.items.forEach(function (it) { live[keyFor(c.cat, it.name, it.note)] = 1; });
    });
    var pruned = false;
    checked.forEach(function (k) { if (!live[k]) { checked.delete(k); pruned = true; } });
    if (pruned) saveChecked();

    if (!cats.length) {
      listEl.innerHTML =
        '<div class="empty"><div class="big">🛒</div>Nothing on the list yet.<br>' +
        'Ask Claude to add something.</div>';
      summaryEl.textContent = "";
      clearEl.hidden = true;
      return;
    }
    var total = 0, left = 0, checkedCount = 0, html = "";
    cats.forEach(function (c) {
      var rows = "", remaining = 0;
      c.items.forEach(function (it) {
        var key = keyFor(c.cat, it.name, it.note);
        var isDone = it.done || checked.has(key);
        if (!isDone) remaining++; else if (checked.has(key)) checkedCount++;
        rows += '<li class="' + (isDone ? "done" : "") + '" data-key="' + esc(key) +
          '" role="button" aria-pressed="' + (isDone ? "true" : "false") +
          '"><span class="box"></span>' +
          '<span class="item"><span class="name">' + esc(it.name) + "</span>" +
          (it.note ? ' <span class="note">— ' + esc(it.note) + "</span>" : "") +
          "</span></li>";
      });
      total += c.items.length; left += remaining;
      html += '<section class="cat"><h2>' + esc(c.cat) +
        '<span class="n">' + remaining + "</span></h2><ul>" + rows + "</ul></section>";
    });
    listEl.innerHTML = html;
    summaryEl.textContent = left + " to buy" + (total - left > 0 ? " · " + (total - left) + " done" : "");
    clearEl.hidden = checkedCount === 0;
  }

  function timeAgo(ms) {
    var s = Math.round((Date.now() - ms) / 1000);
    if (s < 10) return "just now";
    if (s < 60) return s + "s ago";
    var m = Math.round(s / 60);
    if (m < 60) return m + "m ago";
    return Math.round(m / 60) + "h ago";
  }

  function setStatus() {
    if (!lastOk) return;
    var age = Date.now() - lastOk;
    dotEl.className = "dot" + (age > POLL_MS * 3 ? " stale" : "");
    statusEl.textContent = "Updated " + timeAgo(lastOk);
  }

  function load() {
    fetch(SOURCE + "?t=" + Date.now(), { cache: "no-store" })
      .then(function (r) {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.text();
      })
      .then(function (text) {
        lastOk = Date.now();
        if (text !== lastText) { lastText = text; render(parse(text)); }
        setStatus();
      })
      .catch(function () {
        dotEl.className = "dot err";
        statusEl.textContent = lastOk ? "Offline · updated " + timeAgo(lastOk) : "Can't load list";
        if (!lastOk) {
          listEl.innerHTML =
            '<div class="empty"><div class="big">⏳</div>Waiting for <code>list.md</code>.<br>' +
            "If this is a brand-new repo, give GitHub Pages a minute to publish.</div>";
        }
      });
  }

  // Fetch recipes.md (best effort — never blocks the grocery list). Which
  // recipes are shown depends on lastListTags, computed when the list renders.
  function loadRecipes() {
    fetch(RECIPE_SOURCE + "?t=" + Date.now(), { cache: "no-store" })
      .then(function (r) {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.text();
      })
      .then(function (text) {
        if (text !== lastRecipesText) { lastRecipesText = text; lastRecipes = parseRecipes(text); }
        renderRecipes(lastRecipes, lastListTags);
      })
      .catch(function () { /* keep whatever we have; if nothing, panel stays hidden */ });
  }

  // Tap a row to check/uncheck it (saved on this device only).
  listEl.addEventListener("click", function (e) {
    var li = e.target.closest ? e.target.closest("li[data-key]") : null;
    if (!li) return;
    var key = li.getAttribute("data-key");
    if (checked.has(key)) checked.delete(key); else checked.add(key);
    saveChecked();
    render(lastCats);
  });

  // Recipes panel: tap a header to expand/collapse; tap an ingredient to tick it
  // off your cooking checklist. Both are this-device-only and never touch the
  // grocery list or its ticks.
  recipesEl.addEventListener("click", function (e) {
    var head = e.target.closest ? e.target.closest(".recipe-head") : null;
    if (head) {
      var title = head.getAttribute("data-recipe");
      if (recipeOpen.has(title)) recipeOpen.delete(title); else recipeOpen.add(title);
      saveSet(ROPEN, recipeOpen);
      renderRecipes(lastRecipes, lastListTags);
      return;
    }
    var li = e.target.closest ? e.target.closest("li.ring[data-rkey]") : null;
    if (!li) return;
    var key = li.getAttribute("data-rkey");
    if (recipeChecked.has(key)) recipeChecked.delete(key); else recipeChecked.add(key);
    saveSet(RSTORE, recipeChecked);
    renderRecipes(lastRecipes, lastListTags);
  });

  clearEl.addEventListener("click", function () {
    checked.clear();
    saveChecked();
    render(lastCats);
  });

  // Add-item box: POST to the Netlify function, which classifies the item and
  // files it under the right "### category" in list.md. On success we poll a
  // couple of times so the new item shows up as soon as GitHub Pages/Netlify
  // serves the updated file.
  var addForm = document.getElementById("add");
  var addInput = document.getElementById("addInput");
  var addBtn = document.getElementById("addBtn");
  var addMsg = document.getElementById("addMsg");

  function showMsg(text, kind) {
    addMsg.textContent = text;
    addMsg.className = "add-msg" + (kind ? " " + kind : "");
    addMsg.hidden = !text;
  }

  addForm.addEventListener("submit", function (e) {
    e.preventDefault();
    var item = addInput.value.trim();
    if (!item) return;
    addBtn.disabled = true;
    showMsg("Adding…", "");
    fetch("https://git-groceries-netlify.netlify.app/api/add-item", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ item: item }),
    })
      .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
      .then(function (res) {
        if (!res.ok || !res.d.ok) throw new Error((res.d && res.d.error) || "Couldn't add.");
        if (res.d.duplicate) showMsg('"' + res.d.item + '" is already on the list.', "ok");
        else showMsg('Added "' + res.d.item + '" ✓', "ok");
        addInput.value = "";
        // Nudge a few refreshes; the file takes a moment to publish.
        load();
        setTimeout(load, 3000);
        setTimeout(load, 8000);
        setTimeout(function () { showMsg("", ""); }, 4000);
      })
      .catch(function (err) {
        showMsg(err.message || "Couldn't add. Try again.", "err");
      })
      .then(function () { addBtn.disabled = false; });
  });

  function refresh() { load(); loadRecipes(); }

  refresh();
  setInterval(refresh, POLL_MS);
  setInterval(setStatus, 5000);
  document.addEventListener("visibilitychange", function () { if (!document.hidden) refresh(); });
  window.addEventListener("focus", refresh);
})();
</script>
</body>
</html>
